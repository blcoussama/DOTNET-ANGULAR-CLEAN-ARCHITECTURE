# Site CreditFlow pour l'image nginxinc/nginx-unprivileged (copié dans /etc/nginx/conf.d/default.conf).
# - sert la SPA Angular avec repli sur index.html (routes côté client) ;
# - relaie /api/ vers le service « api » du docker-compose (même origine : pas de CORS côté navigateur) ;
# - ajoute les en-têtes de sécurité de la SPA (l'API pose les siens).
# Attention : un add_header déclaré dans un bloc location annule ceux du bloc server.
# Les blocs location ci-dessous utilisent donc « expires » (et non add_header) pour le cache.

# DNS interne de Docker : l'adresse de « api » est résolue à chaque requête (valid=10s),
# ce qui survit à un redémarrage/recréation du conteneur api sans relancer nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # Pièces justificatives : 5 Mo max côté API ; marge pour l'enveloppe multipart.
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/problem+json;

    # --- En-têtes de sécurité de la SPA (hérités par les blocs location sans add_header) ---
    # HSTS volontairement absent : nginx sert ici du HTTP ; l'ajouter sur le proxy TLS en amont.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Aucune ressource tierce : polices (Roboto, Material Icons) embarquées dans le build.
    # script-src 'self' : le build Angular ne contient aucun script inline.
    # style-src 'unsafe-inline' : styles de composants injectés par Angular à l'exécution.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Sonde de vie de nginx lui-même (HEALTHCHECK de l'image), indépendante de l'API.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # --- API : relais vers le conteneur api (le chemin /api/... est transmis tel quel) ---
    location /api/ {
        # L'API pose ses propres en-têtes de sécurité (CSP default-src 'none', no-store...).
        # Déclarer un add_header ici coupe l'héritage de ceux du bloc server : pas de doublons.
        add_header X-Robots-Tag "noindex, nofollow" always;

        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --- Fichiers générés par Angular avec empreinte dans le nom (main-7MWGLY46.js, chunk-C8-eoPV7.js,
    #     styles-XXXXXXXX.css, media/...) ---
    # Cache long : un nouveau build produit de nouveaux noms. Les fichiers de public/ (favicon...)
    # n'ont pas d'empreinte et restent servis par « location / » (revalidation à chaque visite).
    location ~ "-[A-Za-z0-9_-]{8}\.(?:js|mjs|css)$" {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location /media/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # index.html ne doit jamais être mis en cache (il référence les fichiers hachés du dernier build).
    location = /index.html {
        expires -1;
    }

    # --- SPA : toute autre route renvoie index.html (routage côté client) ---
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
